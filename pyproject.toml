[project]
name = "zen-deployed-strategy"
version = "0.1.0"
description = "Deployment-only runner for daily/weekly/monthly quant strategies (research lives elsewhere)."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "httpx>=0.27",
    # Data access is delegated to the existing, live-verified Massive client.
    "massive-access @ git+https://github.com/zen-tradings/zen-massive-data-access.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data*", "strategies*", "deployment*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
